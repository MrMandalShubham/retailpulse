name: Discover Products

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source slug (blank = all enabled sources)"
        default: ""
        type: string
  schedule:
    - cron: "0 0 * * 1" # weekly Monday midnight UTC

concurrency:
  group: discover-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run discovery
        run: pnpm discover:run ${{ inputs.source }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Summary
        if: always()
        run: echo "Discovery completed for source '${{ inputs.source || 'all' }}'"
