name: Deploy

# Deploys to the DigitalOcean droplet after CI passes on main.
# Pulls latest code, rebuilds, migrates, seeds, and restarts the API service.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 10

    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.APP_DIR || '/opt/dip-engine' }}"
            cd "$APP_DIR"

            echo "==> Pulling latest code"
            git pull origin main

            echo "==> Installing dependencies"
            pnpm install --frozen-lockfile

            echo "==> Building"
            pnpm build

            echo "==> Running migrations"
            pnpm db:migrate

            echo "==> Seeding (idempotent)"
            pnpm db:seed

            echo "==> Restarting API service"
            sudo systemctl restart dip-engine-api

            echo "==> Health check"
            sleep 3
            curl -sf http://localhost:3000/health || { echo "Health check failed!"; exit 1; }

            echo "==> Deploy complete"
