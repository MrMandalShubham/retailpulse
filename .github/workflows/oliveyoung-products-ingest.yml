name: OliveYoungProductsIngest

# Combined flow: Discover (if needed) → Ingest batch → Distribute.
# Runs hourly. Discovery only runs when pending products < batch size,
# so we don't re-crawl the entire catalog every hour for nothing.

on:
  schedule:
    - cron: "5 * * * *" # every hour at :05 (avoids GitHub's top-of-hour congestion)
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Products per batch"
        default: "300"
        type: string
      force_discover:
        description: "Force discovery even if enough pending"
        default: false
        type: boolean

concurrency:
  group: oliveyoung-ingest
  cancel-in-progress: false

env:
  SOURCE_SLUG: oliveyoung-global
  BATCH_SIZE: "300"

jobs:
  discover-ingest-distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # --- Check pending count ---
      - name: Check pending products
        id: pending
        run: |
          BATCH="${{ inputs.batch_size || env.BATCH_SIZE }}"
          COUNT=$(pnpm pending-count "$SOURCE_SLUG" 2>/dev/null | tail -1)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "batch=$BATCH" >> "$GITHUB_OUTPUT"
          echo "Pending: $COUNT | Batch size: $BATCH"
          if [ "$COUNT" -lt "$BATCH" ]; then
            echo "needs_discover=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_discover=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # --- Step 1: Discover (only when pending < batch size) ---
      - name: Discover new products
        if: steps.pending.outputs.needs_discover == 'true' || inputs.force_discover == 'true'
        run: |
          echo "Pending (${{ steps.pending.outputs.count }}) < batch (${{ steps.pending.outputs.batch }}) — running discovery"
          pnpm discover:run "$SOURCE_SLUG" 2>&1 | tee /tmp/discover.log
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Skip discovery
        if: steps.pending.outputs.needs_discover == 'false' && inputs.force_discover != 'true'
        run: echo "Enough pending products (${{ steps.pending.outputs.count }}) — skipping discovery"

      # --- Step 2: Ingest batch ---
      - name: Ingest batch
        id: ingest
        run: |
          BATCH="${{ inputs.batch_size || env.BATCH_SIZE }}"
          echo "Ingesting up to $BATCH products from $SOURCE_SLUG"
          pnpm ingest:api "$SOURCE_SLUG" "$BATCH" 2>&1 | tee /tmp/ingest.log
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # --- Step 3: Distribute ---
      - name: Distribute to serving tables
        run: pnpm distribute
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # --- Summary ---
      - name: Run summary
        if: always()
        run: |
          echo "## Olive Young Ingest Run" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Source:** $SOURCE_SLUG" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Pending before run:** ${{ steps.pending.outputs.count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Discovery ran:** ${{ steps.pending.outputs.needs_discover }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Batch size:** ${{ inputs.batch_size || env.BATCH_SIZE }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Timestamp:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/discover.log ]; then
            echo "### Discovery" >> "$GITHUB_STEP_SUMMARY"
            tail -5 /tmp/discover.log >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "### Ingestion" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/ingest.log ]; then
            tail -5 /tmp/ingest.log >> "$GITHUB_STEP_SUMMARY"
          fi
