<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DIP Engine — Operator Dashboard</title>
    <style>
      :root {
        --bg: #0f1420;
        --panel: #171e2e;
        --line: #26304a;
        --text: #e6ebf5;
        --dim: #8b96ad;
        --accent: #5b8cff;
        --ok: #3ecf8e;
        --warn: #f5a623;
        --bad: #ef5b5b;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 system-ui,
          "Segoe UI",
          sans-serif;
        padding: 24px;
      }
      h1 {
        font-size: 20px;
        margin-bottom: 4px;
      }
      h2 {
        font-size: 15px;
        margin-bottom: 10px;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .sub {
        color: var(--dim);
        margin-bottom: 20px;
      }
      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
      }
      .wide {
        grid-column: 1 / -1;
      }
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .stat {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 14px;
        min-width: 110px;
      }
      .stat b {
        display: block;
        font-size: 20px;
      }
      .stat span {
        color: var(--dim);
        font-size: 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th,
      td {
        text-align: left;
        padding: 7px 8px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        color: var(--dim);
        font-weight: 600;
      }
      tr.clickable:hover {
        background: rgba(91, 140, 255, 0.08);
        cursor: pointer;
      }
      input,
      select,
      button {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 7px 10px;
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.danger {
        background: transparent;
        border-color: var(--bad);
        color: var(--bad);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      .badge {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 10px;
        font-size: 11px;
        border: 1px solid var(--line);
      }
      .b-ok {
        color: var(--ok);
        border-color: var(--ok);
      }
      .b-warn {
        color: var(--warn);
        border-color: var(--warn);
      }
      .b-bad {
        color: var(--bad);
        border-color: var(--bad);
      }
      pre {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        overflow: auto;
        font-size: 12px;
        max-height: 340px;
      }
      .muted {
        color: var(--dim);
      }
      #toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: var(--panel);
        border: 1px solid var(--accent);
        border-radius: 8px;
        padding: 10px 16px;
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>DIP Engine — Operator Dashboard</h1>
    <p class="sub">Canonical catalog · promotion queue · audit trail (internal, Phase 5 shell)</p>

    <div class="grid">
      <div class="panel wide">
        <h2>Canonical stats</h2>
        <div class="stats" id="stats"><span class="muted">loading…</span></div>
      </div>

      <div class="panel wide">
        <h2>Products</h2>
        <div class="controls">
          <input id="q" placeholder="search name / brand / category…" size="34" />
          <select id="sort">
            <option value="newest">newest</option>
            <option value="price_asc">price ↑</option>
            <option value="price_desc">price ↓</option>
            <option value="rating">rating</option>
            <option value="confidence">confidence</option>
          </select>
          <input id="minPrice" placeholder="min price" size="8" />
          <input id="maxPrice" placeholder="max price" size="8" />
          <input id="minRating" placeholder="min rating" size="8" />
          <button class="primary" onclick="loadProducts()">Apply</button>
        </div>
        <div id="products"><span class="muted">loading…</span></div>
      </div>

      <div class="panel">
        <h2>Promotion queue (staged candidates)</h2>
        <div class="controls">
          <button class="primary" onclick="runBatch()">Run batch promotion</button>
        </div>
        <div id="queue"><span class="muted">loading…</span></div>
      </div>

      <div class="panel">
        <h2>Promotion runs</h2>
        <div id="runs"><span class="muted">loading…</span></div>
      </div>

      <div class="panel wide">
        <h2>Facts &amp; freshness</h2>
        <div class="stats" id="factStats"><span class="muted">loading…</span></div>
        <div style="margin-top: 12px" id="marketsPanel"><span class="muted">loading…</span></div>
      </div>

      <div class="panel wide" id="detailPanel" style="display: none">
        <h2>Product detail</h2>
        <pre id="detail"></pre>
      </div>
    </div>
    <div id="toast"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const esc = (v) =>
        String(v ?? "—").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const toast = (msg) => {
        const t = $("toast");
        t.textContent = msg;
        t.style.display = "block";
        setTimeout(() => (t.style.display = "none"), 3500);
      };
      const api = async (path, opts) => {
        const res = await fetch(path, opts);
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || "HTTP " + res.status);
        return body;
      };

      async function loadStats() {
        try {
          const s = await api("/products/stats");
          const t = s.totals;
          $("stats").innerHTML =
            [
              ["products", t.products],
              ["brands", t.brands],
              ["categories", t.categories],
              ["types", t.productTypes],
              ["source links", t.sources],
              ["media", t.media],
            ]
              .map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`)
              .join("") +
            (s.latestPromotionRun
              ? `<div class="stat"><b>${esc(s.latestPromotionRun.status)}</b><span>last run · +${s.latestPromotionRun.promotedNew} new / ${s.latestPromotionRun.matchedExisting} matched</span></div>`
              : "");
        } catch (e) {
          $("stats").innerHTML = `<span class="muted">${esc(e.message)}</span>`;
        }
      }

      async function loadProducts() {
        const q = $("q").value.trim();
        const params = new URLSearchParams({ sort: $("sort").value, limit: "25" });
        for (const key of ["minPrice", "maxPrice", "minRating"]) {
          if ($(key).value.trim()) params.set(key, $(key).value.trim());
        }
        try {
          let items;
          if (q) {
            params.set("q", q);
            items = (await api("/products/search?" + params)).products;
          } else {
            items = (await api("/products?" + params)).products;
          }
          if (!items.length) {
            $("products").innerHTML =
              '<span class="muted">no canonical products yet — promote something from the queue</span>';
            return;
          }
          $("products").innerHTML =
            `<table><tr><th>name</th><th>brand</th><th>category / type</th><th>price</th><th>rating</th><th>quality</th></tr>` +
            items
              .map(
                (p) => `<tr class="clickable" onclick="showDetail('${p.id}')">
        <td>${esc(p.name)}</td><td>${esc(p.brand)}</td>
        <td>${esc(p.category)} / ${esc(p.productType)}</td>
        <td>${p.price != null ? esc(p.price) + " " + esc(p.currency) : "—"}</td>
        <td>${esc(p.rating)}</td>
        <td>${p.dataQualityScore != null ? p.dataQualityScore.toFixed(0) + "%" : "—"}</td>
      </tr>`,
              )
              .join("") +
            "</table>";
        } catch (e) {
          $("products").innerHTML = `<span class="muted">${esc(e.message)}</span>`;
        }
      }

      async function showDetail(id) {
        try {
          const [detail, history, prices, ratings] = await Promise.all([
            api("/products/" + id),
            api("/products/" + id + "/history"),
            api("/facts/prices/" + id),
            api("/facts/ratings/" + id),
          ]);
          $("detailPanel").style.display = "block";
          $("detail").textContent = JSON.stringify(
            {
              ...detail,
              history: history.history,
              priceFacts: { latest: prices.latest, timeline: prices.timeline },
              ratingFacts: { latest: ratings.latest, timeline: ratings.timeline },
            },
            null,
            2,
          );
          $("detailPanel").scrollIntoView({ behavior: "smooth" });
        } catch (e) {
          toast(e.message);
        }
      }

      async function loadFacts() {
        try {
          const [fresh, coverage, markets] = await Promise.all([
            api("/freshness/stats"),
            api("/coverage/stats"),
            api("/markets"),
          ]);
          $("factStats").innerHTML = [
            ["price facts (products)", fresh.price.productsWithFacts],
            ["rating facts (products)", fresh.rating.productsWithFacts],
            ["fresh ≤7d", fresh.price.freshWithin7Days],
            ["stale >" + fresh.staleThresholdDays + "d", fresh.price.staleProducts],
            ["no facts yet", fresh.price.productsWithoutFacts],
            ["price coverage", coverage.productCoverage.priceCoveragePct + "%"],
            ["facts w/o market", coverage.priceFactsWithoutMarket],
          ]
            .map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`)
            .join("");
          $("marketsPanel").innerHTML = markets.markets.length
            ? `<table><tr><th>market</th><th>code</th><th>sources</th><th>products</th><th>price facts</th><th>rating facts</th></tr>` +
              markets.markets
                .map(
                  (m) => `<tr>
                    <td>${esc(m.name)}${m.note ? ' <span class="badge b-warn" title="' + esc(m.note) + '">internal code</span>' : ""}</td>
                    <td>${esc(m.code)}</td><td>${m.sourceCount}</td><td>${m.productCount}</td>
                    <td>${m.priceFactCount}</td><td>${m.ratingFactCount}</td>
                  </tr>`,
                )
                .join("") +
              "</table>"
            : '<span class="muted">no markets mapped yet</span>';
        } catch (e) {
          $("factStats").innerHTML = `<span class="muted">${esc(e.message)}</span>`;
        }
      }

      async function loadQueue() {
        try {
          const { queue } = await api("/promotion/queue?limit=25");
          if (!queue.length) {
            $("queue").innerHTML =
              '<span class="muted">queue empty — no unconsidered valid staged products</span>';
            return;
          }
          $("queue").innerHTML =
            `<table><tr><th>name</th><th>brand</th><th>conf</th><th>eligible</th><th></th></tr>` +
            queue
              .map(
                (s) => `<tr>
        <td>${esc(s.name)}<br /><span class="muted">${esc(s.sourceSlug)}</span></td>
        <td>${esc(s.brand)}</td><td>${esc(s.confidenceScore)}</td>
        <td>${s.eligible ? '<span class="badge b-ok">eligible</span>' : `<span class="badge b-warn" title="${esc(s.reasons.join("; "))}">gated</span>`}</td>
        <td>
          <button class="primary" onclick="promoteOne('${s.stagedProductId}')">Promote</button>
          <button class="danger" onclick="rejectOne('${s.stagedProductId}')">Reject</button>
        </td>
      </tr>`,
              )
              .join("") +
            "</table>";
        } catch (e) {
          $("queue").innerHTML = `<span class="muted">${esc(e.message)}</span>`;
        }
      }

      async function loadRuns() {
        try {
          const { runs } = await api("/promotion/runs?limit=10");
          if (!runs.length) {
            $("runs").innerHTML = '<span class="muted">no promotion runs yet</span>';
            return;
          }
          $("runs").innerHTML =
            `<table><tr><th>when</th><th>trigger</th><th>status</th><th>new / matched / skipped / failed</th></tr>` +
            runs
              .map(
                (r) => `<tr>
        <td>${new Date(r.createdAt).toLocaleString()}</td><td>${esc(r.triggerType)}</td>
        <td><span class="badge ${r.status === "succeeded" ? "b-ok" : r.status === "failed" ? "b-bad" : "b-warn"}">${esc(r.status)}</span></td>
        <td>${r.promotedNew} / ${r.matchedExisting} / ${r.skippedItems} / ${r.failedItems}</td>
      </tr>`,
              )
              .join("") +
            "</table>";
        } catch (e) {
          $("runs").innerHTML = `<span class="muted">${esc(e.message)}</span>`;
        }
      }

      async function runBatch() {
        try {
          const summary = await api("/promotion/run", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: "{}",
          });
          toast(
            `batch done: +${summary.promotedNew} new, ${summary.matchedExisting} matched, ${summary.skipped} skipped`,
          );
          refreshAll();
        } catch (e) {
          toast(e.message);
        }
      }

      async function promoteOne(id) {
        try {
          const summary = await api(`/promotion/items/${id}/promote`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: "{}",
          });
          const outcome = summary.outcomes[0];
          toast(`decision: ${outcome ? outcome.decision : "?"}`);
          refreshAll();
        } catch (e) {
          toast(e.message);
        }
      }

      async function rejectOne(id) {
        const reason = prompt("Reject reason (required, goes into the audit trail):");
        if (!reason || !reason.trim()) return;
        try {
          await api(`/promotion/items/${id}/reject`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ reason: reason.trim() }),
          });
          toast("rejected — staged record is no longer promotable");
          refreshAll();
        } catch (e) {
          toast(e.message);
        }
      }

      function refreshAll() {
        loadStats();
        loadProducts();
        loadQueue();
        loadRuns();
        loadFacts();
      }
      refreshAll();
    </script>
  </body>
</html>
